<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Web App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My To-Do List</h1>
            <p>Manage your daily tasks efficiently</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <button id="addBtn"><i class="fas fa-plus"></i> Add Task</button>
        </div>

        <div class="lists-container">
            <div class="list-section">
                <div class="list-header">
                    <h2>Pending Tasks</h2>
                    <span class="count-badge" id="pendingCount">0 pending</span>
                </div>
                <div class="empty-state" id="pendingEmpty">No pending tasks. You're all caught up!</div>
                <ul id="pendingList" class="task-list"></ul>
            </div>

            <div class="list-section">
                <div class="list-header">
                    <h2>Completed Tasks</h2>
                    <span class="count-badge" id="completedCount">0 completed</span>
                </div>
                <div class="empty-state" id="completedEmpty">No completed tasks yet.</div>
                <ul id="completedList" class="task-list"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
