<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Auth System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dash-header">
            <h1>Welcome, <span id="userDisplay">User</span>!</h1>
            <button id="logoutBtn" class="btn-outline">Logout</button>
        </header>
        <main class="dash-content">
            <div class="card">
                <h2>Protected Content</h2>
                <p>This page is only accessible if you are logged in. If you clear your local storage or log out, you will be redirected to the login page.</p>
                <p>Your session is managed via browser localStorage securely.</p>
            </div>
        </main>
    </div>
    
    <script>
        // Protected route check
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('userDisplay').textContent = currentUser;
        }
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
