<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="converter-container">
        <h1>Temperature Converter</h1>
        <div class="input-group">
            <div class="input-wrapper">
                <label for="tempInput">Enter Temperature</label>
                <input type="number" id="tempInput" placeholder="e.g., 25" step="any" required>
            </div>
            <div class="unit-wrapper">
                <label for="unitSelect">From Unit</label>
                <select id="unitSelect">
                    <option value="C">Celsius (°C)</option>
                    <option value="F">Fahrenheit (°F)</option>
                    <option value="K">Kelvin (K)</option>
                </select>
            </div>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <button id="convertBtn" class="btn">Convert</button>

        <div class="results-container" id="resultsContainer">
            <h2>Results</h2>
            <div class="result-card">
                <span class="unit-label">Celsius (°C):</span>
                <span class="unit-value" id="resC">--</span>
            </div>
            <div class="result-card">
                <span class="unit-label">Fahrenheit (°F):</span>
                <span class="unit-value" id="resF">--</span>
            </div>
            <div class="result-card">
                <span class="unit-label">Kelvin (K):</span>
                <span class="unit-value" id="resK">--</span>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
